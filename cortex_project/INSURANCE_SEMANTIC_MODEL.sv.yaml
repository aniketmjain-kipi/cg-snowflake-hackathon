verified_queries:
  - name: 0;1
    question: What is the total premium from active policies?
    sql: SELECT SUM(PREMIUM_AMOUNT) AS TOTAL_PREMIUM FROM policies WHERE POLICY_STATUS
      = 'Active'
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 1;1
    question: How many active policies are there?
    sql: SELECT COUNT(*) AS ACTIVE_POLICY_COUNT FROM policies WHERE POLICY_STATUS
      = 'Active'
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What is the average loss ratio across all policies?
    sql: SELECT AVG(LOSS_RATIO) AS AVG_LOSS_RATIO FROM policies
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What is the average fraud score across all claims?
    sql: SELECT AVG(FRAUD_SCORE) AS AVG_FRAUD_SCORE FROM claims
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 4;1
    question: How many claims are flagged for fraud?
    sql: SELECT COUNT(*) AS FRAUD_FLAGGED_COUNT FROM claims WHERE FRAUD_FLAG = TRUE
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 5;1
    question: What is the total amount paid out for approved claims?
    sql: SELECT SUM(APPROVED_AMOUNT) AS TOTAL_CLAIMS_PAID FROM claims WHERE CLAIM_STATUS
      = 'Approved'
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 6;1
    question: What is the average number of days to resolve a claim?
    sql: SELECT AVG(DAYS_TO_RESOLVE) AS AVG_RESOLUTION_DAYS FROM claims WHERE NOT
      RESOLUTION_DATE IS NULL
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 7;1
    question: What is the total outstanding balance across all billing?
    sql: SELECT SUM(OUTSTANDING_BALANCE) AS TOTAL_OUTSTANDING FROM billing
    verified_at: 1789750403
    verified_by: Semantic Model Generator
  - name: 8;1
    question: What is the total revenue at risk from at-risk policies?
    sql: SELECT SUM(REVENUE_AT_RISK) AS TOTAL_REVENUE_AT_RISK FROM at_risk_policies
    verified_at: 1789750403
    verified_by: Semantic Model Generator